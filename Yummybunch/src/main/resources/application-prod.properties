# ===========================================================================
# PRODUCTION configuration — driven entirely by environment variables.
#
# This file is committed on purpose: it contains no secrets, only the names of
# the variables the host must supply. Activate it with:
#     SPRING_PROFILES_ACTIVE=prod
#
# Local development is unaffected; it keeps using the gitignored
# application.properties.
# ===========================================================================
spring.application.name=Yummybunch
server.port=${PORT:8080}

# ---- Database -------------------------------------------------------------
# Most hosts expose a single JDBC URL. Username/password may be embedded in it
# or supplied separately, so both styles work.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yummybunch}}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
# Driver is inferred from the JDBC URL, so this config works for both
# postgresql:// and mysql:// without edits.

# 'update' keeps the schema in step with the entities without a migration tool.
# Switch to 'validate' once the schema is stable and you manage it deliberately.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# ---- JSON -----------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Auth -----------------------------------------------------------------
# Must be 32+ characters. Changing it signs every user out.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- Email ----------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---- Uploads --------------------------------------------------------------
# Point this at a MOUNTED VOLUME. On a plain container filesystem every
# restaurant photo is destroyed on redeploy.
file.upload-dir=${UPLOAD_DIR:/data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- CORS -----------------------------------------------------------------
# Comma-separated list of the web app's public origins.
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}

# ---- API docs -------------------------------------------------------------
# Swagger UI at /swagger-ui.html. Set DOCS_ENABLED=false in the host dashboard
# to hide the API surface once you no longer want it public.
springdoc.api-docs.enabled=${DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.backend.Yummybunch=INFO
