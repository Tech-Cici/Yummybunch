# ===========================================================================
# Render blueprint. Create from the dashboard: New > Blueprint > pick this repo.
#
# Secrets are deliberately NOT in this file — anything marked sync:false must be
# typed into the Render dashboard. Never commit a credential.
# ===========================================================================
services:
  - type: web
    name: yummybunch-api
    runtime: docker
    dockerfilePath: ./Yummybunch/Dockerfile
    dockerContext: ./Yummybunch
    region: frankfurt          # pick the region closest to your users
    plan: free                 # see the caveats in DEPLOY.md before relying on this
    healthCheckPath: /api/restaurants
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Database lives on Neon (Render's free Postgres expires after 30 days).
      # Set these in the dashboard. DATABASE_URL must be a jdbc: URL, e.g.
      #   jdbc:postgresql://ep-xxxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      # Use Neon's DIRECT host (no '-pooler' in the name).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # Generated once by Render and kept stable. Changing it signs everyone out.
      - key: JWT_SECRET
        generateValue: true

      # --- you must fill these in the dashboard ---
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Brevo API key (Render's free plan blocks SMTP). MAIL_USERNAME is the sender.
      - key: BREVO_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
